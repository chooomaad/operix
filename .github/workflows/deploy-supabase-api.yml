name: Deploy Supabase API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - operix-supabase/supabase/functions/**

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy API Edge Function
        working-directory: operix-supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret before running this workflow."
            exit 1
          fi
          npx --yes supabase@2.122.0 functions deploy api \
            --project-ref vnsuwwglgbqumizqsvoy \
            --no-verify-jwt
